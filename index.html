<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Energy Data Charts</title>
	<link rel="stylesheet" href="styles.css">
	<script src="https://d3js.org/d3.v7.min.js"></script>
	<script src="load-data.js" defer></script>
	<script src="charts/bar.js" defer></script>
</head>
<body>
	<main class="dashboard">
		<h1>Energy Data Charts</h1>

		<section class="charts-grid" aria-label="Data visualizations">
			<div id="bar-chart" class="chart-container" aria-label="Bar chart"></div>
			<div id="donut-chart" class="chart-container" aria-label="Donut chart"></div>
			<div id="line-chart" class="chart-container" aria-label="Line chart"></div>
			<div id="scatter-chart" class="chart-container" aria-label="Scatter chart"></div>
		</section>
	</main>
</body>
</html>
